# Configuration for the data-processing stages (trimmed from the project card). Question, hypotheses and parameters are kept because they enter the hash of the frozen protocol.

project:
  short_name: "A1_dispersed_housing_loja_2026"
  project_crs: "EPSG:32717"        # UTM 17S (southern Ecuador)
  random_seed: 2026

figures:
  font_family: "Palatino Linotype"
  context_vector: ""                # optional: provincial/country boundaries for the location map

# ------------------------------------------------------------
# STAGE 01 — Topic and question
# ------------------------------------------------------------
stage_01_topic:
  contribution_type: "new_region_transferability"   # confirmed by the authors (22 Oct 2026); allowed values: new_method | method_comparison | new_dataset | new_region_transferability | operational_application
  selected_question_en: "Which terrain and road-accessibility factors are associated with the location of dispersed buildings outside census blocks in the Andean periphery of Loja and Catamayo, and how sensitive is that association to the road data source and the spatial scale?"
  status: "APPROVED"

# ------------------------------------------------------------
# STAGE 02 — Literature base (background, not a systematic review)
# ------------------------------------------------------------
stage_02_literature:
  gap_statement: "Building-level models of where dispersed rural housing is located exist for scattered dwellings in Chile (Rojo-Mendoza et al., 2022) and for exurban homes in the USA (Vukomanovic et al., 2019; Inglis et al., 2023), but the studies we reviewed report no spatially independent validation, and none addresses an Andean intermediate city. Rural-settlement studies in mountain areas, mostly from China, work with villages, parcels or counties and rely on expert-weighted suitability indices or on validation against the same settlements used to build the model. Work on Loja, Malacatos and Vilcabamba is qualitative or cartographic (di Campli, 2019; Correa-Jaramillo et al., 2026; Segarra-Morales, 2026). Point-process models and spatial block validation are established in ecology and land-use modelling (Renner et al., 2015; Roberts et al., 2017; Sun and Robinson, 2018) but, to our knowledge, have not been applied to housing in the Andes, and road layers of different origin and endogeneity have not been compared as explanatory sources."
  status: "APPROVED"

# ------------------------------------------------------------
# STAGE 03 — Hypotheses and protocol (frozen before processing data)
# ------------------------------------------------------------
stage_03_hypothesis:
  objective_general: "To quantify how terrain, road accessibility and distance to the urban core explain the location of dispersed rural housing (buildings outside census blocks) in the Andean periphery of Loja and Catamayo, and how much of it lies beyond planning thresholds."
  objectives_specific:
    - "Estimate standardised effects of slope, distance to roads (exogenous IGM 2013 roads versus endogenous tracks and OSM) and distance to the urban core with a presence-background model and spatial block cross-validation."
    - "Compare the explanatory value of alternative road sources (IGM 2013 without tracks, IGM with tracks, OSM 2019, census axes 2020) and document the endogeneity of collaborative and track data."
    - "Quantify heterogeneity among the five centres and across distance rings from the core."
    - "Describe, as sensitivity, the share of dispersed buildings within 25 and 30 m of proxies of the state road network (Ley de Caminos regulation Art. 4) and outside the official 2021 urban limit (Loja, Malacatos, Vilcabamba only)."
    - "Test whether natural amenities (rivers) add explanatory power beyond slope and roads."
  study_area:
    name: "Periphery of Loja, Catamayo, Malacatos, Vilcabamba and San Pedro de la Bendita (Loja province, southern Ecuador)"
    description: "Inter-Andean valleys at about 1,200-2,300 m a.s.l. with strong relief, dry-subtropical to temperate climate, mixed agriculture and pasture. Five growth centres: Loja (provincial capital) and Catamayo (employment poles) and three satellites (Malacatos, Vilcabamba, San Pedro de la Bendita). Dispersed buildings outside census blocks are 79% of buildings in Malacatos, 56% in Vilcabamba, 41% in San Pedro, 9% in Catamayo and 7% in Loja (census 2021). The 2022 census records 40.5% seasonal or vacation dwellings in Malacatos and 24.4% in Vilcabamba. Podocarpus National Park is excluded (official SNAP layer). AOI: 'amplio' scenario built with 30 m raster rules (see ideas/A1_decisiones_y_amenazas.md)."
  method_module: "M03_presencia_fondo"   # methods/M03_presencia_fondo.R (documented in methods/M03_presencia_fondo_README.md)
  # NOTE ON HONESTY: an exploratory analysis preceded this protocol. The hypotheses below
  # were formulated with those results in view and are not pre-registered in the strict sense.
  # Results derived from them are reported as exploratory (decided_before_seeing_results = NO).
  # Metric contract of M03 (exact names): intensity_ratio_slope, intensity_ratio_dist_road_igm_vias, intensity_ratio_dist_nucleo,
  # intensity_ratio_dist_river (intensity ratio per SD; formerly "odds ratio", renamed because the model is a Poisson point process),
  # auc_spatial_cv, cauc_spatial_cv (AUC calibrated with a distance null model, Hijmans 2012), boyce_spatial_cv, share_within_250m_road, share_within_25m_road, share_within_30m_road.
  # Subsets: igm_vias, igm_all, osm2019, census2020, full_igm_amenity, center_<name>, center_min (minimum across centres),
  # ring_<a>_<b>km, sens_domain_<d>, sens_bgratio_<k>, sens_seed_<s>, sens_blocksize_<m>, sens_splines, sens_logit_3to1.
  # operator: >=, >, <=, <   | compare_subset: optional, to compare two scenarios
  hypotheses:
    - id: "H1"
      statement: "Higher slope is associated with lower probability of a dispersed building (standardised odds ratio below 1)."
      metric: "intensity_ratio_slope"
      subset: "igm_vias"
      operator: "<"
      threshold: 1
      compare_subset: ""
      rationale: "Exploratory run (21-oct-2026): intensity ratio per SD 0.44 (95% CI 0.36-0.53); terrain restricts rural settlement location (Mubareka et al. 2008 for elevation and valleys; Zhou et al. 2023). Hypothesis formulated after the exploratory run."
    - id: "H2"
      statement: "Greater distance to roads (exogenous IGM 2013 roads without tracks) is associated with lower probability (odds ratio below 1)."
      metric: "intensity_ratio_dist_road_igm_vias"
      subset: "igm_vias"
      operator: "<"
      threshold: 1
      compare_subset: ""
      rationale: "Exploratory run (21-oct-2026): intensity ratio per SD 0.52 (0.49-0.55); accessibility drives settlement location (Yang et al. 2019). Habitat International 2026 reports a diminishing influence of road distance on land-cover change in Ecuador, so the sign is not guaranteed. Formulated after the exploratory run."
    - id: "H3"
      statement: "Distance to the urban core has a weak independent effect once slope and roads are controlled (odds ratio close to 1)."
      metric: "intensity_ratio_dist_nucleo"
      subset: "igm_vias"
      operator: ">="
      threshold: 0.85
      compare_subset: ""
      rationale: "Exploratory run (21-oct-2026): intensity ratio per SD 1.07 (0.92-1.22). The threshold 0.85 is a judgement with no external source and was set after the exploratory run; the result is reported with its interval."
    - id: "H4"
      statement: "The spline model with slope, IGM roads and distance to the urban core discriminates dispersed-building locations with an AUC of at least 0.75 under spatial block cross-validation after pairwise distance sampling (Hijmans 2012)."
      metric: "cauc_pds_spatial_cv"
      subset: "spl_igm_vias"
      operator: ">="
      threshold: 0.75
      compare_subset: ""
      rationale: "Exploratory run (21-oct-2026): spline model, cAUC after pairwise distance sampling 0.81 (0.745-0.851); linear model 0.81. The 0.75 threshold is a judgement set below the exploratory value, not a pre-registered number; the interval may cross it and is reported as such."
    - id: "H5"
      statement: "A spline model with OSM 2019 roads discriminates better (AUC after pairwise distance sampling) than the same model with IGM 2013 roads, which would reflect the endogeneity of collaborative road data."
      metric: "cauc_pds_spatial_cv"
      subset: "spl_osm2019"
      operator: ">"
      threshold: ""
      compare_subset: "spl_igm_vias"
      rationale: "Exploratory run (21-oct-2026): spline models 0.825 (OSM 2019) versus 0.811 (IGM 2013), with overlapping intervals. The hypothesis is kept to be reported as supported or not. Formulated after the exploratory run."
    - id: "H6"
      statement: "Discrimination holds in every centre: AUC after pairwise distance sampling of at least 0.65 when a centre is held out (spline model)."
      metric: "cauc_pds_spatial_cv"
      subset: "spl_center_min"
      operator: ">="
      threshold: 0.65
      compare_subset: ""
      rationale: "Exploratory run (21-oct-2026): lowest held-out centre 0.709 (Catamayo; no interval available). The 0.65 threshold is a judgement set below the exploratory minimum, not a pre-registered number."
    - id: "H7"
      statement: "Distance to rivers (natural amenity) is associated with higher probability beyond slope and roads (odds ratio below 1)."
      metric: "intensity_ratio_dist_river"
      subset: "full_igm_amenity"
      operator: "<"
      threshold: 1
      compare_subset: ""
      rationale: "Villarrica-Pucon (Chile) found amenities outweigh road accessibility for rural residential plots. Exploratory run (21-oct-2026): intensity ratio per SD for distance to rivers 1.10 (1.02-1.26), i.e. opposite to the hypothesised direction; the hypothesis is kept as formulated and reported as not supported if it holds."
  decided_before_seeing_results: "NO"   # H1-H7 and their thresholds were formulated with the exploratory analysis in view (21 Oct 2026); declared in the Methods and reported as exploratory
  status: "APPROVED"

# ------------------------------------------------------------
# METHOD PARAMETERS (only the block of the chosen module is used)
# ------------------------------------------------------------
method_params:
  # A1 module (methods/M03_presencia_fondo.R; see methods/M03_presencia_fondo_README.md). Reads data/raw directly
  # (does not use the raster stack of stage 05). Each parameter is justified in the module README.
  M03_presencia_fondo:
    data:
      census_gpkg: "data/raw/vector/censo_cartografia_aoi.gpkg"
      presence_layer: "edificios_2021_puntos"        # presences = buildings with en_manzana == 0
      in_block_field: "en_manzana"
      blocks_layer: "manzanas_2021"                  # the background is not sampled inside blocks
      census_axes_layer: "ejes_2021"                 # road source "census2020"
      aoi_gpkg: "data/raw/vector/aoi_estudio.gpkg"   # layers aoi_estricto, aoi_base, aoi_amplio (field centro)
      exclude_vector: "data/raw/vector/areas_protegidas_snap_podocarpus_oficial.gpkg"
      slope_raster: "data/raw/raster/slope_srtm30_x2.tif"
      slope_raster_divisor: 2                        # the raster stores 2 x slope in degrees (uint8); 0 = slope < 0.25 degrees
      igm_gpkg: "data/raw/vector/igm_50k_2013_base.gpkg"
      igm_roads_layers: ["via_l"]                    # IGM roads without tracks or unpaved roads (the most exogenous source)
      igm_all_layers: ["via_l", "sendero_l", "rodera_l"]
      river_layers: ["rio_l"]                        # includes streams: candidate amenity (H7)
      core_layer: "zona_urbana_a"
      core_names: ["LOJA", "CATAMAYO", "MALACATOS", "VILCABAMBA", "SAN PEDRO DE LA BENDITA", "SAN PEDRO DE VILCABAMBA", "TURUNUMA", "LAS PITAS", "SAN CAYETANO BAJO", "CRISTO REY", "AGUAS HEDIONDAS"]
      osm_gpkg: "data/raw/vector/osm_vias_snapshots.gpkg"
      osm_layer: "osm_2019_01"
      urban_limit_vector: "data/raw/vector/limite_urbano_2021.shp"   # Loja, Malacatos and Vilcabamba (does not cover Catamayo or San Pedro de la Bendita)
    domains:
      main: "extended"                               # decision of 21 Oct 2026: wide AOI + 5 km minus 2021 blocks and Podocarpus (less dependent on the AOI rules)
      sensitivity: ["aoi_amplio", "aoi_estricto", "aoi_base", "core_buffer"]   # aoi_amplio = co-principal; strict and base show the effect of the AOI clipping
      extended_buffer_m: 5000                        # the census points cover the wide AOI + 5 km (verified)
      core_buffer_m: 10000
    background:
      ratio_main: 20                                 # background points per presence in the main model
      ladder: [1, 3, 10, 20, 40]                     # convergence check (Renner et al. 2015)
      seeds: [2026, 7, 11]
      naive_logit_ratio: 3                           # unweighted logistic regression, only as a comparison
    cv:
      folds: 5
      repeats: 3
      block_size_m: "auto"                           # range of residual autocorrelation rounded to km, within block_auto_bounds_m
      block_auto_bounds_m: [2000, 16000]
      block_sizes_sensitivity: [2000, 4000, 8000, 16000]
      correlogram_bands: 20
    bootstrap:
      B: 300                                         # block resampling for the intervals of the intensity ratios
      sets: ["igm_vias", "igm_all", "osm2019", "census2020", "full_igm_amenity"]
    nonlinear_df: 3                                  # decision of 21 Oct 2026: MAIN model for fitting and validation = natural splines (subsets spl_*); the linear model summarises the average effect for H1-H3 and H7. 0 = linear only
    nonlinear_df_sensitivity: [2, 5]                 # sensitivity to the degrees of freedom
    min_presences_subset: 200
    rings_km: [0, 2, 5, 10]                          # distance rings from the urban core
    feature_sets:                                    # names = subsets used by the hypotheses
      igm_vias: ["slope", "log_d_igm_vias", "log_d_nucleo"]
      igm_all: ["slope", "log_d_igm_all", "log_d_nucleo"]
      osm2019: ["slope", "log_d_osm2019", "log_d_nucleo"]
      census2020: ["slope", "log_d_census2020", "log_d_nucleo"]
      full_igm_amenity: ["slope", "log_d_igm_vias", "log_d_nucleo", "log_d_river"]
    final_feature_set: "igm_vias"
    thresholds:                                      # planning thresholds: NOT confirmed; use only if there is an official source
      slope_deg: null
      road_distance_m: 250                           # descriptive (exploration), not official
      road_distance_sensitivity_m: [25, 30]          # regulatory sensitivity (decision of 21 Oct 2026): 25 m from the axis (Regulation of the Roads Law, Art. 4) and 30 m with the additional 5 m setback; ONLY on proxies of the state road network (state_networks)
    state_networks:                                  # proxies of the state road network: the 25 m right-of-way applies to the state network, not to all roads; there is no official road inventory in the project
      igm_primaria: {source: igm, layer: via_l, field: hct_desc, values: ["RUTA PRIMARIA"]}
      igm_primaria_secundaria: {source: igm, layer: via_l, field: hct_desc, values: ["RUTA PRIMARIA", "RUTA SECUNDARIA"]}   # secondary routes may include provincial roads
      osm_primaria: {source: osm, field: highway, values: ["trunk", "trunk_link", "primary", "primary_link"]}
      osm_primaria_secundaria: {source: osm, field: highway, values: ["trunk", "trunk_link", "primary", "primary_link", "secondary", "secondary_link"]}

